[project]
name = "distributed-systems-interview"
version = "0.1.0"
description = "Lab automation workflow executor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "nats-py>=2.15.0",
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3.1",
    "PyYAML>=6.0.3",
    "boto3>=1.40",
    "strawberry-graphql>=0.341.2",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML>=6.0.12",
    "boto3-stubs[s3]>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
# Strawberry's field decorators are not typed.
module = "services.executor.schema"
disallow_untyped_decorators = false
